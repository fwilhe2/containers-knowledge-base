name: Update forked repos
on:
  workflow_dispatch:
  schedule:
    # At 07:00 UTC on Sunday
    - cron: '0 7 * * 0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 update-forks.py
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}