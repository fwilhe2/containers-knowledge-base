---
- hosts: all

  vars:
    home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: Create ~/code Directory
      file:
        path: "{{ home }}/code"
        state: directory
        mode: "750"

    - name: Clone container-related git repos
      ansible.builtin.git:
        repo: "{{ item }}"
        dest: '{{ home }}/code/{{ item | urlsplit("path") }}'
        depth: 1
      tags: containers
      loop: "{{ lookup('file', 'git-repos.txt').splitlines() }}"

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install build dependencies for runc
      apt:
        state: present
        name:
        - golang
        - libseccomp2
        - libseccomp-dev
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install build dependencies for crun
      apt:
        state: present
        name:
        - make
        - git
        - gcc
        - build-essential
        - pkgconf
        - libtool
        - libsystemd-dev
        - libprotobuf-c-dev
        - libcap-dev
        - libseccomp-dev
        # crun migrated from yajl to json-c; configure.ac now requires
        # json-c >= 0.14 unconditionally.
        - libjson-c-dev
        - go-md2man
        - autoconf
        - python3
        - automake
      become: true
      when: ansible_os_family == 'Debian'

    - name: Build container-image
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/container-image"

    - name: Install build dependencies for skopeo
      apt:
        state: present
        name:
        - libdevmapper-dev
        - libgpgme-dev
        - go-md2man
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install build dependencies for youki
      apt:
        state: present
        name:
        - pkg-config
        - libsystemd-dev
        - libdbus-glib-1-dev
        - build-essential
        - libelf-dev
        - libseccomp-dev
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install build dependencies for containerd
      apt:
        state: present
        name:
        - libbtrfs-dev
        - btrfs-progs
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install build dependencies for conmon
      apt:
        state: present
        name:
        - gcc
        - git
        - libc6-dev
        - libglib2.0-dev
        - libseccomp-dev
        - pkg-config
        - make
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install runtime dependencies for rootlesskit
      apt:
        state: present
        name:
        - uidmap
      become: true
      when: ansible_os_family == 'Debian'

    # runc now defaults to BUILDTAGS "seccomp libpathrs", but libpathrs is not
    # packaged in Debian or Ubuntu, so pkg-config cannot find it and the cgo
    # build fails. Drop the tag; the Makefile treats a "-" prefix as a removal.
    - name: Build runc
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/runc"
        params:
          RUNC_BUILDTAGS: "-libpathrs"

    # runc's Makefile hardcodes BINDIR to $(PREFIX)/sbin, which is not on a
    # normal user's PATH on Debian. Every other component here lands in
    # /usr/local/bin, so put runc there too, otherwise it is only usable as
    # root and `runc --version` fails for the unprivileged lab user.
    - name: Install runc
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/runc"
        target: install
        params:
          BINDIR: /usr/local/bin

    - name: Configure crun
      ansible.builtin.shell: ./autogen.sh && ./configure
      args:
        chdir: "{{ home }}/code/fwilhe-containers/crun"

    - name: Build crun
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/crun"

    - name: Install crun
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/crun"
        target: install

    - name: Install build dependencies for bubblewrap
      apt:
        state: present
        name:
        - meson
      become: true
      when: ansible_os_family == 'Debian'

    - name: Build bubblewrap
      ansible.builtin.shell: |
        set -e
        if [ -d _builddir ]; then
          meson setup --reconfigure _builddir
        else
          meson setup _builddir
        fi
        meson compile -C _builddir
        meson test -C _builddir
      args:
        chdir: "{{ home }}/code/fwilhe-containers/bubblewrap"

    # Separate task with become, because meson install writes to /usr/local.
    - name: Install bubblewrap
      become: true
      ansible.builtin.shell: meson install -C _builddir
      args:
        chdir: "{{ home }}/code/fwilhe-containers/bubblewrap"

    - name: Build ignite
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/ignite"
        target: ignite
        params:
          GO_MAKE_TARGET: local

    - name: Install ignite
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/ignite"
        target: install
        params:
          GO_MAKE_TARGET: local

    - name: Build containerd
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/containerd"

    - name: Build CNI plugins
      ansible.builtin.shell: ./build_linux.sh
      args:
        chdir: "{{ home }}/code/fwilhe-containers/plugins"

    - name: Create /usr/local/libexec/cni Directory
      become: true
      file:
        path: /usr/local/libexec/cni
        state: directory
        # Not 777: root runs these plugins for pod networking, so a
        # world-writable directory would let any user swap them out.
        mode: "755"

    - name: Install CNI plugins
      become: true
      ansible.builtin.shell: cp bin/* /usr/local/libexec/cni
      args:
        chdir: "{{ home }}/code/fwilhe-containers/plugins"

    - name: Install containerd
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/containerd"
        target: install

    # - name: Build docker cli
    #   community.general.make:
    #     chdir: ~/code/docker/cli
    #     target: binary

    - name: Build skopeo
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/skopeo"

    - name: Install skopeo
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/skopeo"
        target: install

    # - name: Install build dependencies for gvisor
    #   apt:
    #     state: present
    #     name: "{{ item }}"
    #   loop:
    #     - clang

    # - name: Download bazel to build gvisor
    #   become: true
    #   get_url:
    #     url: https://releases.bazel.build/8.0.0/release/bazel-8.0.0-linux-x86_64
    #     dest: /usr/local/bin/bazel
    #     mode: "0777"

    # - name: Build gvisor
    #   ansible.builtin.shell:
    #     cmd: bazel build --enable_workspace -c opt //debian:debian
    #     chdir: "{{ home }}/code/fwilhe-containers/gvisor"

    # - name: install the runsc binary
    #   become: true
    #   ansible.builtin.apt:
    #     deb: "{{ home }}/code/fwilhe-containers/gvisor/bazel-bin/debian/debian.deb"

    - name: Build cri-o
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/cri-o"

    - name: Install cri-o
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/cri-o"
        target: install

    - name: Build conmon
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/conmon"

    - name: Install conmon
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/conmon"
        target: install

    - name: Build rootlesskit
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/rootlesskit"

    - name: Install rootlesskit
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/rootlesskit"
        target: install

    - name: Install build dependencies for slirp4netns
      apt:
        state: present
        name:
        - libglib2.0-dev
        - libslirp-dev
        - libcap-dev
        - libseccomp-dev
      become: true
      when: ansible_os_family == 'Debian'

    - name: Configure slirp4netns
      ansible.builtin.shell: ./autogen.sh && ./configure --prefix=/usr
      args:
        chdir: "{{ home }}/code/fwilhe-containers/slirp4netns"

    - name: Build slirp4netns for rootless networking in podman
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/slirp4netns"

    - name: Install slirp4netns
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/slirp4netns"
        target: install

    - name: Build ctop
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/ctop"
        target: build

    # ctop's Makefile has no install target.
    - name: Install ctop
      become: true
      ansible.builtin.shell:
        cmd: cp ctop /usr/local/bin
        chdir: "{{ home }}/code/fwilhe-containers/ctop"

    # podman 5 dropped CNI: it shells out to netavark for networking and
    # aardvark-dns for name resolution. Both are Rust and require rustc 1.88,
    # newer than the 1.85 in trixie, so take the toolchain from backports.
    - name: Enable backports for a Rust new enough to build netavark
      ansible.builtin.apt_repository:
        repo: "deb http://deb.debian.org/debian {{ ansible_distribution_release }}-backports main"
        state: present
        update_cache: true
      become: true
      when: ansible_distribution == 'Debian'

    # Only the toolchain comes from backports; everything else from stable.
    - name: Install a Rust toolchain new enough for netavark
      apt:
        state: present
        default_release: "{{ ansible_distribution_release }}-backports"
        name:
        - rustc
        - cargo
      become: true
      when: ansible_distribution == 'Debian'

    - name: Install build dependencies for netavark and aardvark-dns
      apt:
        state: present
        name:
        # netavark's dhcp-proxy generates its client code from protobuf at
        # build time, via prost-build, which shells out to protoc.
        - protobuf-compiler
      become: true
      when: ansible_os_family == 'Debian'

    - name: Build netavark
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/netavark"

    # Installs into /usr/local/libexec/podman, which is on podman's
    # helper_binaries_dir search path.
    - name: Install netavark
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/netavark"
        target: install

    - name: Build aardvark-dns
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/aardvark-dns"

    - name: Install aardvark-dns
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/aardvark-dns"
        target: install

    # pasta is podman 5's default for the rootless network namespace. It comes
    # from passt, which is not on GitHub, so it is cloned straight from upstream
    # rather than from a fork in the fwilhe-containers org.
    - name: Build passt
      community.general.make:
        chdir: "{{ home }}/code/passt"

    - name: Install passt
      become: true
      community.general.make:
        chdir: "{{ home }}/code/passt"
        target: install

    # Rootless podman defaults to the systemd cgroup manager, which needs a
    # per-user D-Bus session. The Debian cloud image ships no dbus-user-session,
    # so podman warns about the missing user session and falls back to cgroupfs.
    - name: Install runtime dependencies for podman
      apt:
        state: present
        name:
        - dbus-user-session
      become: true
      when: ansible_os_family == 'Debian'

    # Installing the package is not enough. lima enables lingering, so the user
    # manager is already running by the time we get here and will not pick up
    # the newly installed dbus.socket on its own; without this, /run/user/<uid>/bus
    # never appears and podman still finds no session. Not `enabled`, because
    # dbus.socket is static.
    - name: Start the user D-Bus socket
      ansible.builtin.systemd_service:
        name: dbus.socket
        scope: user
        daemon_reload: true
        state: started
      when: ansible_service_mgr == 'systemd'

    - name: Build podman
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/podman"

    - name: Install podman
      become: true
      community.general.make:
        chdir: "{{ home }}/code/fwilhe-containers/podman"
        target: install

    # The crun lifecycle test needs something listening on the console socket of
    # the container-image bundle. Skipped in the container-based CI, which has no
    # systemd and does not run that test.
    - name: Install netcat for the console socket helper
      apt:
        state: present
        name: netcat-openbsd
      become: true
      when: ansible_os_family == 'Debian' and ansible_service_mgr == 'systemd'

    - name: Create systemd user unit directory
      file:
        path: "{{ home }}/.config/systemd/user"
        state: directory
        mode: "755"
      when: ansible_service_mgr == 'systemd'

    - name: Install the console socket helper unit
      ansible.builtin.copy:
        src: vm-resources/container-socket.service
        dest: "{{ home }}/.config/systemd/user/container-socket.service"
        mode: "644"
      when: ansible_service_mgr == 'systemd'

    # Without lingering the user manager is torn down when the last ssh session
    # closes, so the socket would not be listening when `make test` connects.
    - name: Enable lingering for the console socket helper
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ ansible_user_id }}
        creates: /var/lib/systemd/linger/{{ ansible_user_id }}
      become: true
      when: ansible_service_mgr == 'systemd'

    - name: Enable the console socket helper
      ansible.builtin.systemd_service:
        name: container-socket.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started
      when: ansible_service_mgr == 'systemd'

    # Tools for poking at the stack while it runs, rather than building it.
    # These come from apt on purpose: the from-source builds are reserved for
    # container tools and their dependencies, these are just instruments.
    # Skipped in the container-based CI, which has neither a real kernel nor
    # systemd, so half of them could not work there anyway.
    - name: Install introspection tools
      apt:
        state: present
        name:
        # Namespaces and processes
        - strace
        - ltrace
        - util-linux          # lsns, nsenter, unshare
        - psmisc              # pstree
        - lsof
        - htop
        - iotop-c
        # cgroups and resource limits
        - cgroup-tools        # lscgroup, cgcreate, cgexec
        - stress-ng           # make the limits actually bite
        # Images and filesystems
        # No dive here: it is not packaged in Debian, and this list is apt-only.
        - umoci               # unpack an OCI image into a bundle by hand
        - jq
        - tree
        - ncdu
        - fuse-overlayfs
        # Networking
        - iproute2            # ip netns, ip link
        - nftables            # the rules netavark writes
        - conntrack
        - tcpdump
        - bind9-dnsutils      # dig, to query aardvark-dns
        - socat
        - iputils-ping
        # Capabilities, seccomp, LSMs
        - libcap2-bin         # capsh, getcap
        - seccomp             # scmp_sys_resolver, to decode syscall numbers
        - apparmor-utils
        - auditd              # ausearch, for otherwise silent denials
        # Tracing and eBPF
        - bpftrace
        - bpfcc-tools         # execsnoop, opensnoop, capable, tcpconnect
        - trace-cmd
        - linux-perf
        # The reference material for all of the above, offline
        - manpages            # namespaces(7), cgroups(7), capabilities(7)
        - manpages-dev        # seccomp(2), pivot_root(2)
      become: true
      when: ansible_os_family == 'Debian' and ansible_service_mgr == 'systemd'
